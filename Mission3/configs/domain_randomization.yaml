# Mission3/configs/domain_randomization.yaml
# Konfigurasi ENV Misi 3 (path following + obstacle avoidance, konsep stargaze).
robot_dynamics:
  payload_mass_range: [0.0, 1.0]
  gravity_scale_range: [0.98, 1.02]
randomization: {init_joint_noise: 0.05, obs_noise_std: 0.005}
workspace:
  finish_point_radius_range: [0.35, 0.48]
  finish_point_height_range: [0.25, 0.45]
  finish_point_azimuth_range: [-3.1416, 3.1416]
  base_height_offset: 0.181
physics: {n_substeps: 10, gravity_compensation: true}
action: {max_pos_delta: 0.05, max_rot_delta: 0.08, max_joint_delta: 0.25, max_orientation_dev_deg: 30.0}
ik: {max_iters: 60, pos_tol: 0.0001, rot_tol: 0.002, rot_weight: 0.5}
safety: {terminate_on_contact: true, gripper_collision_radius: 0.04}
validation: {max_scenario_attempts: 40, ik_pos_tol: 0.002, waypoint_step: 0.04, obstacle_margin: 0.01, approach_obstacle_margin: 0.15}  # = level akhir kurikulum (eval & debug harus setara dengan training)
episode: {max_steps: 350, success_pos_threshold: 0.02}
reward: {time_penalty: -0.02, distance_penalty: 0.5, progress_weight: 20.0, smoothness_penalty: 0.05,
  contact_penalty: -10.0, cross_track_penalty: 150.0, phase_transition_bonus: 5.0,
  success_reward: 40.0, obstacle_penalty: 0.02, obstacle_eps: 0.01, collision_penalty: -100.0,
  # shaping rintangan berbasis POTENSIAL: F = gamma*Phi(s') - Phi(s), Phi(c) = -k(1/(c+eps) - 1/(d_safe+eps)).
  # 'state' = penalti per-langkah lama (membuat diam dekat rintangan lebih murah dari bergerak).
  obstacle_mode: potential, obstacle_potential_k: 0.3, obstacle_gamma: 0.995,
  # penalti cross-track fase PENDEKATAN terhadap jalur referensi home->T1 (0 = nonaktif)
  approach_track_penalty: 0.0}
path_task: {t1_reach_threshold: 0.02, cross_track_cap: 0.08, approach_track_cap: 0.25}
mission3:
  constellation_L_values: [0.1, 0.2, 0.3]
  constellation_grid_size: 3
  constellation_n_points_per_face_range: [3, 5]
  constellation_jitter: 0.35
  constellation_min_radius: 0.08
  obstacle_radius: 0.015
  d_safe: 0.12
  collision_margin: 0.0
  min_line_clearance: 0.08
  start_selection: random_safe
  initial_face: auto
  forbidden_faces: [-z]
  home_keepout: 0.06
  max_prune_fraction: 0.6
  min_obstacles: 6
  start_reach: {r_min: 0.25, r_max: 0.95, z_min: 0.12, z_max: 0.95}

# ─── v3: struktur policy (shared/control/reference.py) ───
#   residual : aksi = clip(a_ref + skala * a_RL); a_ref = controller referensi yang mengikuti jalur tervalidasi
#              (pendekatan lurus/polar ke T1, lalu garis T1->T2). RL belajar koreksi. a_ref masuk observasi.
#   direct   : RL mengeluarkan aksi penuh (struktur lama).
policy_structure:
  type: residual
  residual_scale_pos: 0.5      # koreksi posisi maks 0.5 x 5 cm per langkah
  # Misi 3: koreksi RL HANYA posisi. Terukur: pada 4 dari 4 tabrakan policy residual, koreksi rotasi memutar
  # gripper ke batas 30 deg; jalur tervalidasi dihitung dgn orientasi nominal, jadi pergelangan/gripper yang
  # berputar menyapu rintangan berjarak 1 cm dari jalur. Referensi saja (0 deg) sukses pada skenario yang sama.
  # Reward tidak menuntut orientasi tertentu, jadi rotasi RL tidak menambah apa pun di misi ini.
  residual_scale_rot: 0.0
  reference: {gain: 0.8, lookahead: 2}
  # koreksi RL dipudarkan ke 0 bila clearance rintangan < 8 cm (nol penuh di < 2 cm): dekat rintangan
  # dipakai jalur tervalidasi. Tanpa ini: tabrakan 2-16% per evaluasi (koreksi memotong jalur demi kecepatan).
  residual_obstacle_gate: [0.02, 0.08]

# ─── v3: safety filter opsional (shared/safety/shield.py) ───
#   Memeriksa tiap aksi satu langkah ke depan dgn model robot; aksi yang akan menabrak diganti kandidat aman
#   terdekat. Terukur pada policy direct lama (Misi 3, margin eval): kegagalan kontak 38 -> 1 per 200 skenario, tetapi jadi timeout
#   (success tetap) karena rute policy itu sendiri yang tidak layak. Berguna sbg pengaman robot nyata.
safety_filter:
  enabled: false
  contact_margin: 0.01
  obstacle_margin: 0.015
  penalty: 0.0
